apis:
- aid: klang:seed-identity
  name: SEED Identity (OpenID Connect)
  description: 'The OpenID Connect and OAuth 2.0 provider behind SEED player accounts.
    Klang publishes no documentation for it; this entry is recorded from the public
    discovery documents at seed.game and login.seed.game, which advertise authorization,
    token, device-authorization, userinfo, logout and JWKS endpoints with the standard
    OIDC scope set. Identified as a FusionAuth deployment from its endpoint shape and
    its applicationId/authenticationType claims.'
  humanURL: https://seed.game/login
  baseURL: https://login.seed.game/oauth2
  tags:
  - Identity
  - OpenID Connect
  - Authentication
