aid: klang
name: Klang Games
description: 'Klang Games is an entertainment and game development studio headquartered
  in Berlin, founded in 2013 by three Icelandic co-founders — Mundi Vondi (CEO), Oddur
  Snær Magnússon (CTO) and Ívar Emilsson (CCO) — several of whom came out of CCP and
  EVE Online. Its flagship product is SEED, a persistent large-scale MMO society simulator
  built on Google Cloud, backed by investors including Animoca Brands, Supercell, LEGO
  Ventures, Anthos Capital, Kingway Capital and Northzone. Klang publishes no developer
  platform: there is no API documentation, no SDKs and no partner program. The only
  publicly discoverable machine interface is the OpenID Connect provider behind SEED
  player accounts, captured in this repo from its discovery documents.'
